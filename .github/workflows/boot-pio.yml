name: BootZ CI (AHCI)

on:
  push:
    branches: [ "stable" ]
  pull_request:
    branches: [ "stable" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Packages
      run: sudo apt update && sudo apt install mingw-w64 qemu-utils nasm |
          cd src/boot export AHCI_SUPPORT=1 && make -f amd64-ci.make all
    

